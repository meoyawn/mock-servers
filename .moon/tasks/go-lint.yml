inheritedBy:
  tags: [go-lint]
tasks:
  lint:
    description: Format and lint this Go module with the repository's shared policy.
    script: |-
      set -euo pipefail
      mkdir -p .cache
      go tool golangci-lint fmt --config ../.golangci.yaml
      go tool golangci-lint run --config ../.golangci.yaml --allow-parallel-runners --output.json.path .cache/golangci-report.json ./...
    inputs: ['**/*.go', go.mod, go.sum, /.golangci.yaml, /.moon/tasks/go-lint.yml]
    options:
      cache: true
