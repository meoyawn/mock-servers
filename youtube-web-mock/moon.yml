tags: [go-lint, mock-server]
toolchains:
  default: system
tasks:
  mod-download:
    inputs: [go.mod, go.sum]
    script: |-
      set -euo pipefail
      go mod download
    options:
      cache: true
  generate-fixtures:
    description: Encode the synthetic media corpus into the Git-ignored fixtures directory.
    deps: [~:mod-download]
    inputs: ['cmd/youtube-web-mock-generate/**/*.go', go.mod, go.sum]
    outputs: ['fixtures/**/*']
    script: |-
      set -euo pipefail
      go run ./cmd/youtube-web-mock-generate --output fixtures
    options:
      cache: true
  test:
    deps: [~:mod-download, ~:generate-fixtures]
    inputs: ['**/*.go', go.mod, go.sum]
    script: |-
      set -euo pipefail
      go test ./...
    options:
      cache: true
  lint:
    deps: [~:mod-download]
    inputs: ['**/*.go', go.mod, go.sum]
    options:
      cache: true
  check:
    deps: [~:test, ~:lint]
    inputs: []
    options:
      runInCI: false
